# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Sessions and panes
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# Easier splits while keeping tmux's default Ctrl-b prefix.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Ayu-inspired status line.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0f1419,fg=#bfbdb6"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=#ffb454,fg=#0f1419,bold] #S #[default] "
set -g status-right "#[fg=#59c2ff]#{pane_current_path} #[fg=#bfbdb6]· %H:%M "
setw -g window-status-format " #[fg=#6c7680]#I:#W "
setw -g window-status-current-format " #[fg=#ffb454,bold]#I:#W "
set -g pane-border-style "fg=#253340"
set -g pane-active-border-style "fg=#59c2ff"
set -g message-style "bg=#253340,fg=#e6e1cf"
set -g mode-style "bg=#ffb454,fg=#0f1419"
